name: Daily DSA reminder

# Runs hourly, Mon-Sat, between roughly 8:30am and 10:30pm IST (03:30-17:30 UTC).
# Adjust the "30 3-17 * * 1-6" cron below if you want a wider/narrower window —
# GitHub Actions cron is always in UTC. IST = UTC + 5:30.
on:
  schedule:
    - cron: "30 3-17 * * 1-6"
  workflow_dispatch: {} # lets you trigger it manually to test

jobs:
  check-and-remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if a solution was pushed today (IST)
        id: check
        env:
          TZ: Asia/Kolkata
        run: |
          TODAY=$(date +%F)
          COUNT=$(git log --since="$TODAY 00:00:00" --until="$TODAY 23:59:59" \
                    --oneline -- 'solutions/**/*.py' | wc -l)
          echo "commits_today=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Solutions pushed today: $COUNT"

      - name: Send Discord alert if nothing pushed yet
        if: steps.check.outputs.commits_today == '0'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sf -H "Content-Type: application/json" \
            -d '{"content": "⏰ No DSA solution pushed yet today. Pick a problem and commit one before the day ends!"}' \
            "$WEBHOOK"
